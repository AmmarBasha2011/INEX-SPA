name: "PHPMD"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 6"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  phpmd:
    name: PHPMD Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: phpmd

      - name: Run PHPMD
        run: |
          mkdir -p phpmd-results
          phpmd . text cleancode,codesize,design --reportfile phpmd-results/phpmd.xml
          cat phpmd-results/phpmd.xml
